function sectionBeforeNoise(raw){const lines=String(raw||'').replace(/\r/g,'').split(/\n/);const out=[];for(const line of lines){const c=cleanHeaderText(line);if(/^(?:\*+\s*)?(?:datos\s+que\s+no\s+forman|ejemplo\s+de\s+calendario|simulaci[oó]n\s+(?:para\s+)?(?:entender\s+)?el\s+calendario|resumen(?:\s+de\s+la\s+sesi[oó]n)?|volumen\s+total|progresi[oó]n(?:\s+de\s+ejemplo)?|historial\s*,?\s*ignorar)\b/i.test(c))break;out.push(line)}return out.join('\n')}
function detectFixedDays(raw){const fixed={};const lines=sectionBeforeNoise(String(raw||'')).split(/\n+/).map(s=>s.trim()).filter(Boolean);

function timerUI(){const rem=timerRemaining(),m=Math.floor(rem/60),s=rem%60;document.getElementById("timerValue").textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;document.getElementById("timerToggle").textContent=translateText(timerState.running?"Pausar":"Seguir")}
function restoreTimerUI(){if(timerRemaining()>0){document.getElementById("timer").classList.remove("hide");applyTimerPos(loadTimerPos());timerUI();if(timerState.running)runTimerLoop()}}
function clampTimerPos(x,y){const el=document.getElementById("timer"),w=el.offsetWidth||230,h=el.offsetHeight||56,pad=6;return{x:Math.max(pad,Math.min(window.innerWidth-w-pad,x)),y:Math.max(pad,Math.min(window.innerHeight-h-pad,y))}}
function applyTimerPos(pos){if(!pos||!Number.isFinite(Number(pos.x))||!Number.isFinite(Number(pos.y)))return;const el=document.getElementById("timer"),p=clampTimerPos(Number(pos.x),Number(pos.y));el.style.left=`${p.x}px`;el.style.top=`${p.y}px`;el.style.right="auto";el.style.bottom="auto"}
function loadTimerPos(){try{return JSON.parse(localStorage.getItem(TIMER_POS_KEY)||"null")}catch(e){return null}}
function saveTimerPos(){const el=document.getElementById("timer"),r=el.getBoundingClientRect();try{localStorage.setItem(TIMER_POS_KEY,JSON.stringify({x:r.left,y:r.top}))}catch(e){}}
function initTimerDrag(){const el=document.getElementById("timer"),handle=document.getElementById("timerValue");let drag=null,hold=null;const end=e=>{clearTimeout(hold);hold=null;if(!drag)return;if(drag.active){el.classList.remove("dragging");saveTimerPos();try{handle.releasePointerCapture?.(drag.pointerId)}catch(_){}}drag=null};handle.addEventListener("pointerdown",e=>{if(e.button!=null&&e.button!==0)return;const r=el.getBoundingClientRect();drag={pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,left:r.left,top:r.top,active:false};hold=setTimeout(()=>{if(!drag)return;drag.active=true;el.classList.add("dragging");el.style.left=`${r.left}px`;el.style.top=`${r.top}px`;el.style.right="auto";el.style.bottom="auto";handle.setPointerCapture?.(e.pointerId)},180)});handle.addEventListener("pointermove",e=>{if(!drag?.active||e.pointerId!==drag.pointerId)return;e.preventDefault();const p=clampTimerPos(drag.left+(e.clientX-drag.startX),drag.top+(e.clientY-drag.startY));el.style.left=`${p.x}px`;el.style.top=`${p.y}px`});handle.addEventListener("pointerup",end);handle.addEventListener("pointercancel",end);window.addEventListener("resize",()=>{const pos=loadTimerPos();if(pos)applyTimerPos(pos)})}
async function refreshPwaStatus(){const top=document.getElementById("pwaTopText");if(top)top.textContent=navigator.onLine?(isStandalone()?"INSTALADA":"EN LÍNEA"):"SIN CONEXIÓN";const dot=document.getElementById("pwaSettingsDot"),status=document.getElementById("pwaSettingsStatus"),btn=document.getElementById("installPwaBtn"),persist=document.getElementById("persistBtn");if(dot)dot.className="pwa-dot "+(navigator.serviceWorker?.controller?"ok":"");if(status)status.textContent=isStandalone()?"Instalada":navigator.serviceWorker?.controller?"Lista":"Preparando";if(btn)btn.style.display=isStandalone()?"none":"inline-flex";if(navigator.storage?.persisted)try{pwaPersisted=await navigator.storage.persisted()}catch(e){}if(persist){persist.textContent=pwaPersisted?"Protegidos ✓":"Proteger";persist.disabled=!!pwaPersisted}localizeUI(document)}
async function installPWA(){if(isStandalone())return toast("Ya está instalada.");if(deferredInstallPrompt){deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;return}toast("Chrome ⋮ → Instalar aplicación")}
async function requestPersistentStorage(){if(!navigator.storage?.persist)return toast("No disponible en este navegador.",true);const ok=await navigator.storage.persist();pwaPersisted=ok;refreshPwaStatus();toast(ok?"Datos protegidos.":"No se concedió persistencia.",!ok)}
function registerPWA(){if("serviceWorker" in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("./service-worker.js",{scope:"./",updateViaCache:"none"}).then(reg=>reg.update()).catch(()=>{});window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstallPrompt=e;refreshPwaStatus()})}

document.addEventListener("click",e=>{const rb=e.target.closest("[data-route]");if(rb)return nav(rb.dataset.route);const b=e.target.closest("[data-action]");if(!b)return;const a=b.dataset.action;if(a==="today"){ui.workoutDate=isoToday();ui.workoutSessionId=scheduleSessionId(ui.workoutDate);nav("workout")}else if(a==="open-date"){ui.workoutDate=b.dataset.date;ui.workoutSessionId=b.dataset.session;nav("workout")}else if(a==="toggle-ex"){const id=b.dataset.id,opening=ui.openExercise!==id;ui.openExercise=opening?id:false;workout();if(opening)setTimeout(()=>document.getElementById(`ex-${id}`)?.scrollIntoView({behavior:"smooth",block:"start"}),30)}else if(a==="step-ex"){const rs=routines(ui.workoutSessionId),i=rs.findIndex(r=>r.id===ui.openExercise),j=i+Number(b.dataset.dir);if(j>=0&&j<rs.length){ui.openExercise=rs[j].id;workout();setTimeout(()=>document.getElementById(`ex-${rs[j].id}`)?.scrollIntoView({behavior:"smooth",block:"start"}),30)}}else if(a==="finish-workout"){ui.openExercise=false;save();nav("dashboard");setTimeout(()=>toast("Sesión finalizada."),40)}else if(a==="rir"){const r=routineById(b.dataset.id);if(r){const l=getLog(b.dataset.date,r),i=Number(b.dataset.index);l.sets[i]=l.sets[i]||{};l.sets[i].rir=Number(b.dataset.rir);l.anomaly=anomaly(l);save();workout()}}else if(a==="copy-prev")copyPrev(b.dataset.date,b.dataset.id);else if(a==="copy-session")copySession();else if(a==="timer")startTimer(Number(b.dataset.sec));else if(a==="rtab"){ui.routineSessionId=b.dataset.session;routine()}else if(a==="edit-program")editProgramModal();else if(a==="edit-week"||a==="edit-frequency")frequencyModal();else if(a==="setup-language"){changeLanguage(b.dataset.lang)}else if(a==="setup-frequency-mode"){state.program.scheduleMode=b.dataset.mode==="interval"?"interval":"weekdays";save(false);setup()}else if(a==="frequency-mode"){const mode=b.dataset.mode==="interval";const h=document.getElementById("frequencyMode"),box=document.getElementById("frequencyFields");if(h)h.value=mode?"interval":"weekdays";document.querySelectorAll("[data-action=frequency-mode]").forEach(x=>x.classList.toggle("active",x.dataset.mode===(mode?"interval":"weekdays")));if(box){box.innerHTML=frequencyFieldsHTML(mode);localizeUI(box)}}else if(a==="import-routine")routineImportModal();else if(a==="analyze-routine-import")analyzeRoutineImport();else if(a==="routine-import-back")routineImportModal();else if(a==="apply-routine-import")applyRoutineImport();else if(a==="new-session"||a==="setup-add-session")sessionModal();else if(a==="edit-session")sessionModal(b.dataset.id);else if(a==="edit-exercise")exerciseModal(b.dataset.id||null,b.dataset.session||null);else if(a==="move-ex")moveExercise(b.dataset.id,b.dataset.dir);else if(a==="delete-exercise")deleteExercise(b.dataset.id);else if(a==="delete-session")deleteSession(b.dataset.id);else if(a==="edit-log")editLogModal(b.dataset.id);else if(a==="delete-log"){if(confirm("¿Eliminar este registro?")){state.logs=state.logs.filter(l=>l.id!==b.dataset.id);save();closeModal();history();toast("Registro eliminado.")}}else if(a==="close")closeModal();else if(a==="submit-form")submitNamedForm(b.dataset.form);else if(a==="metric"){ui.metric=b.dataset.metric;progress()}else if(a==="home-metric-info")showHomeMetricInfo(b.dataset.info);else if(a==="export-json")exportJSON();else if(a==="export-csv")exportCSV();else if(a==="import")document.getElementById("backupInput").click();else if(a==="install-pwa")installPWA();else if(a==="persist-storage")requestPersistentStorage();else if(a==="finish-setup"){const scheduled=state.program.scheduleMode==="interval"?new Set(state.program.sessions.map(s=>s.id)):new Set(Object.values(state.program.schedule).filter(Boolean)),missing=[...scheduled].filter(sid=>!routines(sid).length);if(!state.routine.length)return toast("Añade al menos un ejercicio.",true);if(!scheduled.size)return toast("Define al menos una sesión de entrenamiento.",true);if(missing.length)return toast(`Faltan ejercicios en: ${missing.map(sessionName).join(", ")}`,true);state.setupComplete=true;save();nav("dashboard");toast("Rutina guardada.")}else if(a==="reset"){if(confirm("¿Crear una rutina nueva? Descarga una copia de seguridad si quieres conservar una copia.")){const meta=state._meta,prefs=clone(state.settings);state=makeEmpty();state.settings={...state.settings,...prefs};state._meta={...meta,revision:Number(meta?.revision||0)+1,updatedAt:Date.now(),appVersion:APP_VERSION};persistCurrent();render()}}});
document.addEventListener("input",e=>{const el=e.target;if(!state.setupComplete){if(el.id==="setupLanguage"){changeLanguage(el.value);return}else if(el.id==="setupName"){state.program.name=el.value;save(false)}else if(el.id==="setupStart"&&el.value){state.program.startDate=el.value;save(false);const p=document.getElementById("setupIntervalPreview");if(p)p.textContent=intervalPreviewText()}else if(el.id==="setupWeeks"){state.program.weeks=Math.max(1,Number(el.value)||16);save(false)}else if(el.id==="setupIntervalDays"){state.program.intervalDays=Math.max(1,Math.min(30,Number(el.value)||2));save(false);const p=document.getElementById("setupIntervalPreview");if(p)p.textContent=intervalPreviewText()}else if(el.matches("[data-setup-day]")){state.program.schedule[el.dataset.setupDay]=el.value||null;save(false)}return}if(el.matches("[data-entry]"))updateEntry(el,false);else if(el.dataset.filter==="q"){ui.historySearch=el.value;history();const x=document.querySelector('[data-filter="q"]');x?.focus();x?.setSelectionRange(ui.historySearch.length,ui.historySearch.length)}else if(el.id==="threshold"&&el.value){state.settings.anomalyThreshold=Math.max(1,Number(el.value)||500);state.logs.forEach(l=>l.anomaly=anomaly(l));save(false)}});
document.addEventListener("change",e=>{const el=e.target;if(!state.setupComplete){if(el.id==="setupLanguage"){changeLanguage(el.value);return}else if(el.id==="setupUnit"){state.settings.unit=el.value;save(false)}else if(el.matches("[data-setup-day]")){state.program.schedule[el.dataset.setupDay]=el.value||null;save(false)}return}if(el.matches("[data-entry]")){updateEntry(el,true)}else if(el.id==="workDate"){ui.workoutDate=el.value;ui.workoutSessionId=scheduleSessionId(el.value)||ui.workoutSessionId;ui.openExercise=null;workout()}else if(el.id==="workSession"){ui.workoutSessionId=el.value;ui.openExercise=null;workout()}else if(el.dataset.filter==="session"){ui.historySession=el.value;history()}else if(el.dataset.filter==="status"){ui.historyStatus=el.value;history()}else if(el.id==="pex"){ui.progressExercise=el.value;progress()}else if(el.id==="unit"){convertUnit(el.value);settings()}else if(el.id==="theme"){state.settings.theme=el.value;save();render()}else if(el.id==="language"){changeLanguage(el.value)}else if(el.id==="threshold"){state.settings.anomalyThreshold=Math.max(1,Number(el.value)||500);state.logs.forEach(l=>l.anomaly=anomaly(l));save();settings()}});
document.getElementById("modalbg").addEventListener("click",e=>{if(e.target.id==="modalbg")closeModal()});
document.getElementById("timerToggle").addEventListener("click",()=>{if(timerState.running){timerState.remaining=timerRemaining();timerState.running=false;timerState.endAt=null;clearInterval(timerState.handle)}else if(timerState.remaining>0){timerState.running=true;timerState.endAt=Date.now()+timerState.remaining*1000;runTimerLoop()}persistTimer();timerUI()});
document.getElementById("timerPlus").addEventListener("click",()=>{if(timerState.running&&timerState.endAt)timerState.endAt+=30000;else timerState.remaining=timerRemaining()+30;persistTimer();timerUI()});document.getElementById("timerClose").addEventListener("click",()=>{clearInterval(timerState.handle);timerState={remaining:0,running:false,endAt:null,handle:null};try{localStorage.removeItem(TIMER_KEY)}catch(e){}document.getElementById("timer").classList.add("hide")});
document.getElementById("backupInput").addEventListener("change",async e=>{const f=e.target.files?.[0];if(!f)return;try{const raw=JSON.parse(await f.text()),keepLang=appLang(),x=normalizeState(raw);if(!x)throw new Error("Formato incompatible");if(!raw?.settings?.language)x.settings.language=keepLang;if(confirm("¿Reemplazar los datos actuales por esta copia de seguridad?")){const rev=Number(state?._meta?.revision||0)+1;state=x;state._meta={...(state._meta||{}),revision:rev,updatedAt:Date.now(),appVersion:APP_VERSION};persistCurrent();render();toast("Copia de seguridad restaurada.")}}catch(err){toast("No se pudo importar.",true)}e.target.value=""});
window.addEventListener("hashchange",()=>{const r=location.hash.replace("#/","");if(ROUTES[r]){if(r==="settings"&&ui.route!=="settings")ui.previousRouteBeforeSettings=ui.route;ui.route=r;render()}});document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();if((e.key==="Enter"||e.key===" ")&&e.target?.matches?.("[role=button][data-action]")){e.preventDefault();e.target.click()}});window.addEventListener("pagehide",()=>{persistTimer();flushPersistence()});window.addEventListener("beforeunload",()=>{persistTimer();persistCurrent()});document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){persistTimer();flushPersistence()}else{timerState=loadTimerState();restoreTimerUI()}});
registerPWA();initTimerDrag();render();restoreTimerUI();hydrateDurableState();
